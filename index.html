<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mira V01</title>

  <script type="module"

    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">

  </script>

  <style>

    html, body {

      margin: 0;

      width: 100%;

      height: 100%;

      overflow: hidden;

      background: #111;

    }

    model-viewer {

      width: 100%;

      height: 100%;

      background: #111;

    }

  </style>

</head>

<body>

  <model-viewer

    src="HD Mira V01.glb"

    alt="Mira 3D model"

    camera-controls

    touch-action="pan-y"

    auto-rotate

    shadow-intensity="1"

    exposure="1"

    environment-image="neutral"

    ar>

  </model-viewer>

</body>

</html>
